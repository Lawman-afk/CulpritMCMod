# Gradle daemon memory (the legacy plugin decompiles Minecraft in its own process).
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# Must match the CurseForge test instance (minecraftinstance.json -> baseModLoader): "Culprit1.20.1", forge-47.4.28.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.28
# Built on 47.4.28; the mod asks for any Forge build of 1.20.1 (players' packs often keep older builds).
forge_version_range=[47,)
# MixinExtras, packed in the jar (Forge 1.20.1 carries none; the mod's hooks wrap methods and calls with it).
mixinextras_version=0.5.5

## Compatibility runs (optional; none of these is a dependency of the mod)
# Modrinth version ids: Oculus 1.8.0 (Iris for Forge) and Embeddium 0.3.31 (Sodium for Forge) for -PwithIris; the
# shader packs the dev runs test with: Complementary Reimagined and Unbound r5.9.3, BSL 10.1.8, Bliss 2.1.2, Photon 1.4,
# Solas 3.9, MakeUp Ultra Fast 9.6; Distant Horizons 3.3.3 for -PwithDH.
oculus_version=iQ1SwGc3
embeddium_version=UTbfe5d1
complementary_version=Bqen1mJX
bsl_version=Y68yiql9
bliss_version=kC2Y8q1P
photon_version=BnGklH5y
solas_version=IsqhVpb8
makeup_version=t4YRxQug
unbound_version=B1kyfoUZ
dh_version=6UnEfsRQ

## Mod properties
mod_id=culprit
mod_name=Culprit
mod_license=MIT
mod_version=0.1.1
mod_group_id=dev.culprit
mod_authors=Lawman-afk
mod_description=Find what is lagging your game. Culprit times every block entity, entity and block tick on the server and everything drawn on your screen, shows the cost on the world itself, and tells you what keeps each chunk loaded.

## Deployment
# Folder of the CurseForge instance that every `build` copies the jar into (its mods folder). Set it in your own
# ~/.gradle/gradle.properties (or pass -Pculprit_instance_dir_1_20_1=...); left blank, the jar just stays in build/libs.
culprit_instance_dir_1_20_1=
