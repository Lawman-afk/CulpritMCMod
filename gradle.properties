# Gradle daemon memory. NeoForm decompile/recompile runs in its own process, so 2G is plenty here.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# Must match the CurseForge test instance (minecraftinstance.json -> baseModLoader): "Culprit1.21.1", neoforge-21.1.266.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# The NeoForge builds the mod asks for: 21.1.22 and later (players' packs often keep older builds). The mixins use
# MixinExtras' @WrapMethod (0.4); NeoForge carries MixinExtras 0.4.1 from 21.1.22, 0.3.5 before.
neo_version_range=[21.1.22,)
neo_version=21.1.266

## Compatibility runs (optional; none of these is a dependency of the mod)
# Modrinth version ids: Iris 1.8.14-beta.1, Sodium 0.8.13 (NeoForge 1.21.1) for -PwithIris; the shader packs the dev runs
# test with: Complementary Reimagined and Unbound r5.9.3, BSL 10.1.8, Bliss 2.1.2, Photon 1.4, Solas 3.9, MakeUp Ultra
# Fast 9.6; Distant Horizons 3.3.3 for -PwithDH.
iris_version=KduFYu4t
sodium_version=uMOpc5uV
# -PirisStable: Iris 1.8.12 and Sodium 0.6.13, the released pair most 1.21.1 shader players have.
iris_stable_version=t3ruzodq
sodium_stable_version=Pb3OXVqC
complementary_version=Bqen1mJX
bsl_version=Y68yiql9
bliss_version=kC2Y8q1P
photon_version=BnGklH5y
solas_version=IsqhVpb8
makeup_version=t4YRxQug
unbound_version=B1kyfoUZ
dh_version=9w34y8ai

## Mod properties
mod_id=culprit
mod_name=Culprit
mod_license=MIT
mod_version=0.1.1
mod_group_id=dev.culprit
mod_authors=Lawman-afk
mod_description=Find what is lagging your game. Culprit times every block entity, entity and block tick on the server and everything drawn on your screen, shows the cost on the world itself, and tells you what keeps each chunk loaded.

## Deployment
# Folder of the CurseForge instance that every `build` copies the jar into (its mods folder). Set it in your own
# ~/.gradle/gradle.properties (or pass -Pculprit_instance_dir=...); left blank, the jar just stays in build/libs.
culprit_instance_dir_1_21_1=
