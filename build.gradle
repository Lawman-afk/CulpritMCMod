plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Resources produced by the data generators (lang).
    srcDir('src/generated/resources')

    // The data generators' cache (patterns are relative to each resource folder).
    exclude("**/.cache", "**/.cache/**")
}

repositories {
    // Iris and Sodium, as released (run with -PwithIris), the shader packs the dev runs test with, Distant Horizons:
    // compatibility runs only, never dependencies of the mod.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    archivesName = "${mod_id}-mc${minecraft_version}"
}

// The licence travels in the jar (MIT asks for its notice in every copy).
tasks.named('jar', Jar) {
    def licenceName = "LICENSE_${project.property('mod_id')}"
    from('LICENSE') {
        rename { licenceName }
    }
    // The dev aids (the prepared test world, photographers) and the developer's tests (GameTests and their
    // structures) are for the dev runs only, never in a released jar.
    exclude('dev/culprit/devworld/**', 'dev/culprit/gametest/**', 'data/culprit/structure/gametest/**')
    // So are this branch's own mixins for the test server (dev/culprit/port/mixin, which only the dev runs apply) and
    // their config: left out, and the mod file's entry for them (marked "dev runs only") with them.
    exclude('dev/culprit/port/mixin/**', 'culprit.port.mixins.json')
    filesMatching('META-INF/neoforge.mods.toml') {
        filter { String line -> line.contains('dev runs only') || line.contains('.port.mixins.json') ? null : line }
    }
}

// Minecraft 1.21.1 runs on Java 21, so this branch targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Every compile error at once while porting (javac stops at 100).
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }

// The photographers' window, width x height: -PshotSize=1920x1080 for the mod page's gallery pictures.
def shotSize = (project.findProperty('shotSize') ?: '1280x720').toString().split('x')

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Makes the test world "Culprit Lab" (run/saves/culprit_lab) with lag sources set out and signs saying what to
        // try, photographs the results into run/screenshots/lab_*.png and quits, the world saved to copy into the test
        // instance's saves (devworld, left out of the jar).
        lab {
            client()
            programArguments.addAll '--width', shotSize[0], '--height', shotSize[1]
            systemProperty 'culprit.lab', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Launches a GameTestServer, runs every registered gametest for this mod, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // -PonlyTests=<name>,<name>: only those tests (GameTestRegistration).
            systemProperty 'culprit.onlyTests', (project.findProperty('onlyTests') ?: '').toString()
            // -Pbench: the idle-cost benchmark (BenchTests); -PnoHooks: without the tick hooks, to compare.
            systemProperty 'culprit.bench', providers.gradleProperty('bench').isPresent().toString()
            systemProperty 'culprit.noHooks', providers.gradleProperty('noHooks').isPresent().toString()
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            if (project.findProperty('jfr') != null) {
                def jfrDir = file('run/jfr')
                jfrDir.mkdirs()
                jvmArguments.add("-XX:StartFlightRecording=filename=${new File(jfrDir, project.findProperty('jfr').toString() + '.jfr').absolutePath},settings=profile,dumponexit=true".toString())
            }
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// -PirisStable: the released pair most 1.21.1 shader players have (Iris 1.8.12 asks for Sodium 0.6.13); without it the
// newest (Iris 1.8.14's beta with Sodium 0.8).
def irisStable = providers.gradleProperty('irisStable').isPresent()
def irisVersion = irisStable ? iris_stable_version : iris_version
def sodiumVersion = irisStable ? sodium_stable_version : sodium_version

// Runtime-only dependencies for dev testing that must not leak into the published metadata.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Main's nullness annotations (26.x ships them; 1.21.1 does not): only to compile, as annotations go unread.
    compileOnly 'org.jspecify:jspecify:1.0.0'
    // Shader packs (optional at runtime): -PwithIris runs Iris and Sodium in the dev client (Sodium from run/mods,
    // sodiumToMods below).
    if (providers.gradleProperty('withIris').isPresent()) {
        localRuntime "maven.modrinth:iris:${irisVersion}"
    }
    // Distant Horizons (optional at runtime): -PwithDH runs it in the dev client.
    if (providers.gradleProperty('withDH').isPresent()) {
        localRuntime "maven.modrinth:distanthorizons:${dh_version}"
    }
}

// The test runs leave the person at the computer their mouse and their ears (the user's wishes): their window shows
// behind the other windows without the focus and never grabs the mouse (dev.culprit.client.DevRuns, set by
// culprit.keepMouse; the runs turn the camera themselves), NeoForge's early loading window turned off for them in
// run/config/fml.toml; every client run is muted (master volume 0 in run/options.txt; -Psound=on keeps the sound) and
// skips the first-launch accessibility screen. The test runs' names go in testRunNames as they are added.
def testRunNames = ['runLab']
def fmlConfig = file('run/config/fml.toml')
def clientOptions = file('run/options.txt')
def withSound = providers.gradleProperty('sound').isPresent()
neoForge.runs.matching { ('run' + it.name.capitalize()) in testRunNames }.configureEach {
    systemProperty 'culprit.keepMouse', 'true'
}
tasks.matching { it.name in testRunNames }.configureEach {
    doFirst {
        fmlConfig.parentFile.mkdirs()
        String text = fmlConfig.exists() ? fmlConfig.text : ''
        fmlConfig.text = text =~ /(?m)^earlyWindowControl\s*=/
                ? text.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, 'earlyWindowControl = false')
                : text + 'earlyWindowControl = false\n'
    }
}
tasks.matching { it.name.startsWith('run') && !(it.name in ['runGameTestServer', 'runServer', 'runData']) }.configureEach {
    doFirst {
        String text = clientOptions.exists() ? clientOptions.text : ''
        clientOptions.parentFile.mkdirs()
        if (!withSound) {
            text = text =~ /(?m)^soundCategory_master:/
                    ? text.replaceAll(/(?m)^soundCategory_master:.*$/, 'soundCategory_master:0.0')
                    : text + 'soundCategory_master:0.0\n'
        }
        text = text =~ /(?m)^onboardAccessibility:/
                ? text.replaceAll(/(?m)^onboardAccessibility:.*$/, 'onboardAccessibility:false')
                : text + 'onboardAccessibility:false\n'
        clientOptions.text = text
    }
}

// The shader packs the dev runs test with (-PwithIris; -PirisPack=complementary|unbound|bsl|bliss|photon|solas|makeup|off
// picks one, Complementary by default): put in run/shaderpacks, and Iris's config pointed at the one picked.
configurations {
    shaderPacks {
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    shaderPacks "maven.modrinth:complementary-reimagined:${complementary_version}@zip"
    shaderPacks "maven.modrinth:bsl-shaders:${bsl_version}@zip"
    shaderPacks "maven.modrinth:bliss-shader:${bliss_version}@zip"
    shaderPacks "maven.modrinth:photon-shader:${photon_version}@zip"
    shaderPacks "maven.modrinth:solas-shader:${solas_version}@zip"
    shaderPacks "maven.modrinth:makeup-ultra-fast-shaders:${makeup_version}@zip"
    shaderPacks "maven.modrinth:complementary-unbound:${unbound_version}@zip"
}
var installShaderPacks = tasks.register('installShaderPacks') {
    group = 'development'
    description = 'Puts the test shader packs in run/shaderpacks and sets Iris to the one -PirisPack names.'
    var packs = configurations.shaderPacks
    var pick = (project.findProperty('irisPack') ?: 'complementary').toString()
    var runDir = file('run')
    inputs.files(packs)
    outputs.upToDateWhen { false }
    doLast {
        var dir = new File(runDir, 'shaderpacks')
        dir.mkdirs()
        // Each pack's file by the name -PirisPack picks it by.
        var names = ['complementary-reimagined': 'complementary', 'complementary-unbound': 'unbound', 'bsl-shaders': 'bsl',
                     'bliss-shader': 'bliss', 'photon-shader': 'photon', 'solas-shader': 'solas', 'makeup-ultra-fast-shaders': 'makeup']
        String chosen = null
        var wanted = packs.files.collect { f -> var key = names.keySet().find { f.name.startsWith(it) }; key != null ? names[key] + '.zip' : f.name }
        dir.listFiles().findAll { it.name.endsWith('.zip') && !wanted.contains(it.name) }.each { it.delete() }   // packs named otherwise before
        packs.files.each { f ->
            var key = names.keySet().find { f.name.startsWith(it) }
            var name = key != null ? names[key] + '.zip' : f.name
            java.nio.file.Files.copy(f.toPath(), new File(dir, name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            if (key != null && names[key] == pick.toLowerCase()) {
                chosen = name
            }
        }
        var config = new File(runDir, 'config/iris.properties')
        config.parentFile.mkdirs()
        var props = new Properties()
        if (config.exists()) {
            config.withInputStream { props.load(it) }
        }
        props.setProperty('enableShaders', (pick != 'off' && chosen != null).toString())
        if (chosen != null) {
            props.setProperty('shaderPack', chosen)
        }
        config.withOutputStream { props.store(it, 'Set by gradle installShaderPacks') }
        // Iris's own metadata warns as it loads, and NeoForge's warning screen would hold the photographers before
        // the title screen: the dev runs with Iris skip it.
        var neo = new File(runDir, 'config/neoforge-client.toml')
        if (neo.exists()) {
            neo.text = neo.text.replaceAll(/(?m)^showLoadWarnings\s*=\s*true/, 'showLoadWarnings = false')
        } else {
            neo.text = 'showLoadWarnings = false\n'
        }
        logger.lifecycle("Shader packs in ${dir}; Iris set to ${pick == 'off' ? 'no pack' : chosen}")
    }
}
// Sodium for 1.21.1 comes as a wrapper: a library of its early start-up classes with the mod itself and its Fabric API
// parts packed inside. On the dev runs' classpath the launcher took the wrapper for the mod and loaded none of Sodium
// (Iris then failed for want of its classes); from a mods folder it loads as it does for players. So the dev runs with
// Iris put it in run/mods, and the others take it out again (as Ground Burst's 1.21.1 build does).
configurations {
    sodiumWrapper {
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    sodiumWrapper "maven.modrinth:sodium:${sodiumVersion}"
}
var sodiumToMods = tasks.register('sodiumToMods', Sync) {
    from(configurations.sodiumWrapper)
    into file('run/mods')
    preserve { include '**/*' }
    rename { 'sodium-dev-iris.jar' }
}
var sodiumFromMods = tasks.register('sodiumFromMods', Delete) {
    delete file('run/mods/sodium-dev-iris.jar')
}
if (providers.gradleProperty('withIris').isPresent()) {
    tasks.matching { it.name.startsWith('run') && it.name != 'runData' }.configureEach { it.dependsOn installShaderPacks, sodiumToMods }
} else {
    tasks.matching { it.name.startsWith('run') }.configureEach { it.dependsOn sodiumFromMods }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------------------------------------
// Deployment: every `build` ends with the fresh jar in the CurseForge test instance that `culprit_instance_dir_1_21_1`
// names (set in your own ~/.gradle/gradle.properties); without one the jar just stays in build/libs.
// ---------------------------------------------------------------------------------------------

abstract class DeployToInstance extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getJarFile()

    @Internal
    abstract DirectoryProperty getModsDir()

    @Input
    abstract Property<String> getModId()

    /** Whether an instance folder was named outright (culprit_instance_dir_1_21_1): then a missing one is an error. */
    @Input
    abstract Property<Boolean> getRequired()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void deploy() {
        File dir = modsDir.isPresent() ? modsDir.get().asFile : null
        if (dir == null || !dir.parentFile.isDirectory()) {
            String where = dir == null ? "(no folder set on this system)" : "${dir.parentFile}"
            if (required.get()) {
                throw new GradleException("CurseForge instance not found at ${where}. " +
                        "Set culprit_instance_dir_1_21_1 in gradle.properties or pass -Pculprit_instance_dir_1_21_1=<path>.")
            }
            // Anyone else building the mod has no test instance: the jar stays in build/libs.
            logger.lifecycle("No CurseForge instance at ${where}: the jar was not deployed (set culprit_instance_dir_1_21_1 to deploy it).")
            return
        }
        dir.mkdirs()

        // Remove every previous build of this mod (any version) so only one copy is ever loaded.
        String prefix = modId.get() + '-'
        dir.listFiles()
                .findAll { it.isFile() && it.name.startsWith(prefix) && it.name.endsWith('.jar') }
                .each { old ->
                    if (!old.delete()) {
                        throw new GradleException("Could not delete ${old} - is Minecraft still running from that instance?")
                    }
                    logger.lifecycle("Removed old jar ${old.name}")
                }

        File jar = jarFile.get().asFile
        fs.copy {
            from jar
            into dir
        }
        logger.lifecycle("Deployed ${jar.name} -> ${dir}")
    }
}

var instanceDir = providers.gradleProperty('culprit_instance_dir_1_21_1')
        .filter { !it.isBlank() }

var deployToInstance = tasks.register('deployToInstance', DeployToInstance) {
    group = 'deployment'
    description = 'Copies the built mod jar into the 1.21.1 CurseForge test instance (culprit_instance_dir_1_21_1), replacing older builds.'
    jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    modsDir = layout.dir(instanceDir.map { new File(it, 'mods') })
    modId = project.mod_id
    required = providers.gradleProperty('culprit_instance_dir_1_21_1').map { !it.isBlank() }.orElse(false)
    outputs.upToDateWhen { false }
}

tasks.named('build') {
    finalizedBy deployToInstance
}
